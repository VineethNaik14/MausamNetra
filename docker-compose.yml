services:
  # ---- Member 2: streaming backbone ----
  kafka:
    image: apache/kafka:3.9.0
    container_name: mausamnetra-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: mausamnetra-ingestion
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_CLEANED=weather.cleaned
    depends_on:
      - kafka
    restart: unless-stopped

  # ---- Member 3: event classification ----
  classifier:
    build: ./ml/classification
    container_name: mausamnetra-classifier
    ports:
      - "8000:8000"
    restart: unless-stopped

  # ---- Member 4: trust / verification engine ----
  verification:
    build:
      context: .
      dockerfile: Dockerfile.verification
    container_name: mausamnetra-verification
    ports:
      - "8001:8001"
    environment:
      - LOG_LEVEL=INFO
      - CLASSIFIER_MODE=http
      - CLASSIFIER_HTTP_URL=http://classifier:8000
    depends_on:
      - classifier
    restart: unless-stopped

  # ---- Integration bridge: consumes weather.cleaned, calls classifier +
  # verification in order, hands the merged record onward. Replace/extend
  # once Member 5's backend owns persistence (see interfaces/repositories.py). ----
  pipeline-worker:
    build:
      context: .
      dockerfile: integration/Dockerfile
    container_name: mausamnetra-pipeline-worker
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_CLEANED=weather.cleaned
      - CLASSIFIER_URL=http://classifier:8000
      - VERIFICATION_URL=http://verification:8001
    depends_on:
      - kafka
      - classifier
      - verification
    restart: unless-stopped

  # ---- Member 5 placeholder: PostgreSQL + PostGIS ----
  db:
    image: postgis/postgis:16-3.4
    container_name: mausamnetra-db
    environment:
      POSTGRES_USER: mausamnetra
      POSTGRES_PASSWORD: mausamnetra
      POSTGRES_DB: mausamnetra
    ports:
      - "5432:5432"
    volumes:
      - mausamnetra_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  mausamnetra_pgdata:
